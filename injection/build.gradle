plugins {
    id("canaree.android.library")
    id("canaree.hilt")
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace 'dev.olog.injection'
    defaultConfig {
        consumerProguardFiles 'consumer-rules.pro'

        buildConfigField 'String', "LAST_FM_KEY", localProperties.last_fm_key
        buildConfigField 'String', "LAST_FM_SECRET", localProperties.last_fm_secret
        buildConfigField 'String', "AES_PASSWORD", localProperties.aes_password
    }

    buildFeatures {
        buildConfig = true
    }

    //kotlinOptions.allWarningsAsErrors = true

}

dependencies {
    implementation project(':core')
    implementation project(':data')
    implementation project(':shared')
    implementation project(':equalizer')

    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.appcompat

    implementation libs.okhttp
    implementation libs.retrofit
    implementation libs.room.runtime

    implementation libs.aes.crypto
}
